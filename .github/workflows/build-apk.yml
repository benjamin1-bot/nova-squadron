name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK erzeugen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk NovaSquadron.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaSquadron-APK
          path: NovaSquadron.apk

      - name: Als Release veröffentlichen (einfacher Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova Squadron – Build ${{ github.run_number }}
          body: |
            APK zum Installieren auf Android: **NovaSquadron.apk** unten antippen.
            Beim ersten Mal „Installation aus unbekannten Quellen“ erlauben.
          files: NovaSquadron.apk
          make_latest: true
