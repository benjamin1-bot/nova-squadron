name: APK bauen

on:
  push:
    branches: [ main, html-final ]
    paths-ignore: [ 'godot/**', '.github/workflows/godot.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK erzeugen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Prismwing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prismwing-APK
          path: Prismwing.apk

      - name: Als Release veröffentlichen (einfacher Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'html-final' && 'html-final-v67' || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_name == 'html-final' && 'Prismwing HTML-Version – gesichert (Stand Build 67)' || format('Prismwing – Build {0}', github.run_number) }}
          body: |
            APK zum Installieren auf Android: **Prismwing.apk** unten antippen.
            Beim ersten Mal „Installation aus unbekannten Quellen“ erlauben.
          files: Prismwing.apk
          make_latest: ${{ github.ref_name != 'html-final' }}
