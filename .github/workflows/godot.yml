name: Godot bauen und testen

on:
  push:
    branches: [ main ]
    paths: [ 'godot/**', '.github/workflows/godot.yml' ]
  workflow_dispatch:

concurrency:
  group: godot
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VER: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot und Export-Vorlagen laden
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VER}-stable_linux.x86_64 godot-bin && chmod +x godot-bin
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VER}.stable /tmp/tpl
          unzip -q Godot_v${GODOT_VER}-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VER}.stable/

      - name: Android-Signatur und Editor-Einstellungen
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-${GODOT_VER}.tres
          sed -i 's/^ *//' ~/.config/godot/editor_settings-*.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Projekt importieren
        run: |
          timeout 300 ./godot-bin --headless --path godot --import 2>&1 | tail -30 || true
          timeout 120 ./godot-bin --headless --path godot --editor --quit 2>&1 | tail -10 || true

      - name: Skripte prüfen
        run: |
          for f in main.gd game.gd game_boss.gd $(ls godot/*.gd | xargs -n1 basename | grep -v -e '^main.gd$' -e '^game.gd$' -e '^game_boss.gd$'); do
            echo "== $f" >> check.txt
            timeout 120 ./godot-bin --headless --path godot --check-only --script res://$f >> check.txt 2>&1 || true
          done
          cat check.txt | grep -v "^$" | tail -40
          if grep -q "SCRIPT ERROR" check.txt; then echo "::error::Skriptfehler"; exit 1; fi

      - name: APK exportieren
        run: |
          ./godot-bin --headless --path godot --export-debug "Android" ../Prismwing-Godot.apk 2>&1 | tail -40
          ls -la Prismwing-Godot.apk

      - name: APK sofort veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-${{ github.run_number }}
          name: Prismwing Godot – Testbuild ${{ github.run_number }}
          body: |
            Godot-4-Version von Prismwing (in Arbeit). APK unten antippen zum Installieren.
          files: Prismwing-Godot.apk
          make_latest: false

      - name: Testpilot (Screenshots + Protokoll)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p autotest
          run_world() {
            W=${1%%:*}; X=""; case "$1" in *:*) X="${1#*:}";; esac; D=autotest/welt$(echo $1 | tr ':=-' '___')
            mkdir -p $D
            timeout 400 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin --path godot --rendering-method mobile --resolution 1280x720 -- --autotest --world=$W $X --out=$PWD/$D > $D/log.txt 2>&1 || true
            if ! ls $D/*.png > /dev/null 2>&1; then
              echo "Vulkan nicht verfügbar – Ersatzlauf mit OpenGL" >> $D/log.txt
              timeout 400 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin --path godot --rendering-driver opengl3 --resolution 1280x720 -- --autotest --world=$W $X --out=$PWD/$D >> $D/log.txt 2>&1 || true
            fi
          }
          export -f run_world
          cat godot/autotest_worlds.txt | tr ' ' '\n' | grep . | xargs -P 3 -I{} bash -c 'sleep $((RANDOM % 5)); run_world {}'
          grep -h "AUTOTEST: \(Welt\|Fertig\)\|SCRIPT ERROR" autotest/welt*/log.txt || true
          cp check.txt autotest/ || true
          ls autotest
          zip -q -r autotest.zip autotest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autotest
          path: autotest

      - name: Als Release veröffentlichen
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-${{ github.run_number }}
          name: Prismwing Godot – Testbuild ${{ github.run_number }}
          body: |
            Godot-4-Version von Prismwing (in Arbeit). APK unten antippen zum Installieren.
          files: |
            Prismwing-Godot.apk
            autotest.zip
          fail_on_unmatched_files: false
          make_latest: false
